                "completed_tasks": 5,
                "overdue_tasks": 1,
                "completion_rate": 0.4167,
                "has_tasks": true,
                "total_milestones": 4,
                "completed_milestones": 1,
                "next_due_task": {"id": 7, "title": "Validate hero copy", "due_date": "2026-05-15"},
                "next_due_milestone": {"id": 2, "title": "Design ready", "due_date": "2026-06-20"},
