name: 'Project Progress'
description: |-

  Read-only progression endpoint for a project. Computes a snapshot from the
  project's tasks (source of truth) and milestones, and returns it alongside a
  per-milestone breakdown so the front-end can render a roadmap with visual
  progress without firing additional requests.

  The full ownership chain `Customer → Client → Project` is enforced via the
  existing `ProjectPolicy`.
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: 'api/projects/{project_id}/progress'
    metadata:
      custom: []
      groupName: 'Project Progress'
      groupDescription: |-

        Read-only progression endpoint for a project. Computes a snapshot from the
        project's tasks (source of truth) and milestones, and returns it alongside a
        per-milestone breakdown so the front-end can render a roadmap with visual
        progress without firing additional requests.

        The full ownership chain `Customer → Client → Project` is enforced via the
        existing `ProjectPolicy`.
      subgroup: ''
      subgroupDescription: ''
      title: "Get the project's progression."
      description: |-
        Returns global task/milestone counts, the next-due task and milestone,
        an `is_overdue` flag, and a milestone-by-milestone task breakdown.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      project_id:
        custom: []
        name: project_id
        description: 'The ID of the project.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      project:
        custom: []
        name: project
        description: 'The project ID.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      project_id: 1
      project: 1
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
